[pytest]
# Plain, dependency-free defaults so `pytest` just works in VS Code.
#
# The previous config forced `-n 2 --dist loadscope` and declared pytest-xdist
# as a required plugin, so running the tests without xdist installed failed
# with "Missing required plugins" before a single test was collected.
# Add `-n 2 --dist loadscope` yourself if you want parallel runs.
testpaths = tests_unit tests
python_files = test_*.py
addopts = -q
asyncio_mode = auto
markers =
    integration: needs a running backend at EXPO_PUBLIC_BACKEND_URL
